   app.dataset.theme=theme;
   app.querySelectorAll('[data-theme-choice]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.themeChoice===theme)));
   const toggle=app.querySelector('[data-toggle-theme]');if(toggle){toggle.setAttribute('aria-label',theme==='light'?'Включить тёмную тему':'Включить светлую тему');app.querySelector('[data-theme-name]').textContent=theme==='light'?'Светлая':'Тёмная';}
   app.querySelectorAll('[data-screen]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.screen===screen)));
   app.querySelectorAll('[data-screen-panel]').forEach(panel=>panel.hidden=panel.dataset.screenPanel!==screen);
   app.querySelector('[data-breadcrumb]').textContent='Рабочее место / '+(screen==='dialogs'?'Диалоги':'Чек-листы');
   app.querySelectorAll('[data-criterion]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.criterion===criterion)));
   app.querySelectorAll('[data-message]').forEach(message=>message.dataset.linked=String(message.dataset.message===criteria[criterion].message));
   app.querySelector('[data-evidence]').textContent=criteria[criterion].name+' · '+criteria[criterion].message;
  });
 }
 function save(app){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{project:'EVA',kind:'navigation-options',theme,screen,layout:app.closest('[data-variant]').dataset.variant},privateContent:{criterion}}).catch(()=>{});}
 function restore(state){theme=state?.modelContent?.theme==='dark'?'dark':'light';screen=state?.modelContent?.screen==='dialogs'?'dialogs':'checklists';criterion=criteria[state?.privateContent?.criterion]?state.privateContent.criterion:'consultation';render();}
 root.addEventListener('click',event=>{
  const app=event.target.closest('.en-app');if(!app)return;
  const mode=event.target.closest('[data-theme-choice]');const toggle=event.target.closest('[data-toggle-theme]');const nav=event.target.closest('[data-screen]');const selection=event.target.closest('[data-criterion]');const example=event.target.closest('[data-open-criterion]');
  if(mode)theme=mode.dataset.themeChoice;else if(toggle)theme=theme==='light'?'dark':'light';else if(nav)screen=nav.dataset.screen;else if(selection)criterion=selection.dataset.criterion;else if(example){criterion=example.dataset.openCriterion;screen='dialogs';}else return;
  render();if(example)app.querySelector('[data-criterion="'+criterion+'"]').focus();save(app);
 });
 restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
 if(globalThis.Tweak){apps.forEach(app=>{const state={radius:20};const tweak=new Tweak({container:app,onChange:()=>app.style.setProperty('--en-radius',state.radius+'px')});tweak.addSlider(state,'radius',{label:'Скругления карточек',min:12,max:28,step:2,unit:'px',reference:'--en-radius'});});}
})();
</script>
</div>
